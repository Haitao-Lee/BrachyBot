# ── Not admitted in the current product/tool environment (not permanent impossibility) ──
excluded_candidates:
  - {ext_id: EXT-5, name: MedAgentBench,     reason: "FHIR sandbox; no certified current product action bridge. A separate complete common harness is required."}
  - {ext_id: EXT-6, name: MedCTA,            reason: "generic OCR/retrieval tools + paid Serper/Mathpix + data not public; BrachyBot cannot participate in its toolchain"}
  - {ext_id: EXT-7, name: PhysicianBench,    reason: "FHIR/MiniAgent long-horizon EHR; current product bridge not certified and Redivis access gates remain"}
  - {ext_id: EXT-8, name: HealthAgentBench,  reason: "terminal Agent + EHRSHOT/CT-RATE/MIMIC-CXR gating; BrachyBot has no EHR/terminal capability"}

# ── Explicitly excluded (must not be added just for "quantity") ──
excluded:
  - {category: no complete loop, examples: [MedFlowBench, MedOpenClaw], reason: "cannot confirm downloadable/reproducible/verifier"}
  - {category: medical research pipeline, examples: [AutoMedBench], reason: not a clinical Viewer/planning Agent}
  - {category: medical administration, examples: [CHI-Bench, HealthAdminBench], reason: not a core workflow}
  - {category: patient-facing primary care, examples: [PatientAgentBench], reason: "different roles/tools/permissions"}
  - {category: static medical QA is auxiliary only, examples: [MedQA, MedMCQA, PubMedQA, MedHELM], reason: "not core tools/state/evidence/plan measurement; overlapping source pools must not be counted twice"}
  - {category: general imaging VQA, examples: [VQA-RAD, SLAKE, PathVQA, MedRAX], reason: cannot measure the brachy pipeline}
  - {category: external-beam or general segmentation, examples: [OpenKBP, BraTS], reason: "is a fixture/local capability, not an Agent"}
  - {category: protocol/method class, examples: [SameInputRerun, FairnessProtocols], reason: "embedded in this proposal, not scored independently"}

# ── Panels without a "clean" public anchor ──
panels_without_clean_anchor: [P2, P7, P8]
panels_with_main_anchor:
  P1: [EXT-2]
  P3: [EXT-1]
  P4: [EXT-1, EXT-14]
  P5: [EXT-3, EXT-14]
  P6: [EXT-4]
  P7: []
  P8: []
  P9: []
