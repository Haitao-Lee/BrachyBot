# BrachyBench · EXT track global manifest (DESIGN §25.2)
#
# Role: index and status table for benchmarks/external/; per-benchmark acquisition details are in
# acquisition/<ext_id>.yaml (DESIGN §25.4).
# Current selection/audit: docs/BENCHMARK_PUBLIC_COLLECTION_AUDIT_2026-10-03.md.
# The prior 2026-09-29 selection is historical, not the current inventory.
#
# Legacy adapter status is not protocol fidelity or published-comparison eligibility.
# Foreign-tool common-harness experiments and native product evaluation are separate.
#
# 11 legacy adapters, plus 12 locked collections under public_collection/.
# Historical E0 in results/e0_summary.json is only a component self-test.

version: "2.0"
track: EXT
public_collection_catalog: public_collection/catalog.json
public_collection_asset_lock: public_collection/assets.lock.json
current_selection: public_collection/selection.json
current_audit: ../../docs/BENCHMARK_PUBLIC_COLLECTION_AUDIT_2026-10-03.md
policy:
  eligibility: "BrachyBot must be able to participate as the SUT (possess the capability domain required by the benchmark)"
  main_requires: "grade_R == R0 and grade_C == C3"
  specialty_requires: "grade_R == R0 and grade_C == C2"
  no_cross_track_total_score: true            # no combined total score with the PRV track (DESIGN §1.3)
  e0_is_component_self_test_only: true
  native_product_and_common_harness_results_separate: true
  protocol_fidelity_certification_required: true
  external_results_never_write_into:           # DESIGN §25.8 hard prohibition
    - BrachyBot/session/
    - BrachyBot/case/
    - BrachyBot/runtime/
    - BrachyBot/report/

